[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phronon-backend"
version = "0.1.0"
description = "Local Python backend for the Phronon study assistant."
requires-python = ">=3.11"
dependencies = ["pypdf>=5,<6"]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10,<1",
  "pypdfium2>=4.30,<5",
  "Pillow>=11,<12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
